project:
  type: book

book:
  title: "{{REPORT_TITLE}}"
  author:
    - {{REPORT_AUTHOR}}
  date: today
  date-format: "MMMM D, YYYY"
  chapters:
    - index.qmd
    - Chapter-1.qmd
    - Chapter-2.qmd
    - Chapter-3.qmd
    - Chapter-4.qmd
    - conclusion.qmd
    - references.qmd
  appendices:
    - Code.qmd
    - Screenshots.qmd
  subtitle: "{{REPORT_SUBTITLE}}"
  type: report

bibliography: references.bib
csl: ./ieee-with-url.csl

filters:
  - acronyms


acronyms:
  loa_header_classes:
    - unnumbered
  fromfile: ./acronyms.yml
  insert_links: false
  insert_loa: false

format:
  pdf:
    number-sections: true
    documentclass: scrreprt
    indent: true
    code-overflow: wrap
    link-citations: true
    mainfont: "Latin Modern Roman"
    sansfont: "Latin Modern Roman"
    fontsize: 13pt
    header-includes:
      - \usepackage{fancyhdr}
      - \pagestyle{fancy}
      - \fancyhead[L]{\nouppercase}
      - \usepackage{wallpaper}
      - \usepackage{graphicx}
      - \usepackage{fvextra}
      - \usepackage{eso-pic}
      - \usepackage{tikz}
      - \usepackage{etoolbox}
      - \AtBeginEnvironment{longtable}{\hyphenpenalty=10000\exhyphenpenalty=10000}
      - \AtEndEnvironment{longtable}{\hyphenpenalty=50\exhyphenpenalty=50}
      - \renewcommand{\arraystretch}{1.2}
      - \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines=true,breakanywhere=true,commandchars=\\\{\}}
      - \DefineVerbatimEnvironment{OutputCode}{Verbatim}{breaklines=true,breakanywhere=true,commandchars=\\\{\}}