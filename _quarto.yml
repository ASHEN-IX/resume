project:
  type: default
  output-dir: _output
  render:
    - index.qmd
lang: en
pagetitle: "Mohamed Aziz Kammoun — Resume"
author-meta: "Mohamed Aziz Kammoun"
format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    embed-resources: true
    output-file: resume.html
  pdf:
    documentclass: article
    pdf-engine: lualatex
    papersize: a4
    fontsize: 10pt
    geometry:
      - margin=1.4cm
    colorlinks: true
    toc: false
    number-sections: false
    include-in-header: resume-header.tex
    output-file: resume.pdf
