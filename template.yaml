# {{REPORT_TITLE}}
# Replace this YAML dict with the report metadata. Used by _quarto.yml and by
# the AI agent that fills the template.
# - `title`          → book title (also shown in PDF metadata).
# - `subtitle`       → subtitle, if any.
# - `author`         → list of authors (strings).
# - `program`        → internship / fellowship / course name.
# - `duration`       → internship period. List format or single string.
# - `acknowledgement`→ short thank-you paragraph (rendered on index.qmd).
# - `state`          → where the report is in the authoring workflow
#   (draft | chapters-done | tables-done | figures-done | final-proof).
#
# Example:
#
# report:
#   title: "ACME AGM: An AI Orchestration Platform for Internship Management"
#   subtitle: "Summer Internship Report"
#   author:
#     - "Jane Q. Developer"
#   program: "Hackership"
#   duration:
#     from: 2026-07-01
#     to: 2026-08-31
#   acknowledgement: >
#     I thank my supervisor, Mr. John Smith, for guidance throughout this
#     internship, and the ACME team for their support.
#   state: draft

report:
  title: "{{REPORT_TITLE}}"
  subtitle: "{{REPORT_SUBTITLE}}"
  author:
    - "{{REPORT_AUTHOR}}"
  program: "{{PROGRAM_NAME}}"
  duration:
    from: "{{INTERNSHIP_START}}"
    to: "{{INTERNSHIP_END}}"
  acknowledgement: "{{ACKNOWLEDGEMENT_TEXT}}"
  state: draft

# Chapter titles — used by index.qmd, cross-references (@sec-*), the TOC, and
# the chapter headers. Order matches the chapters list in _quarto.yml.
chapters:
  1: "{{CHAPTER_TITLE_1}}"
  2: "{{CHAPTER_TITLE_2}}"
  3: "{{CHAPTER_TITLE_3}}"
  4: "{{CHAPTER_TITLE_4}}"

# Acronyms — see acronyms.yml for the full list.
acronyms:
  file: ./acronyms.yml
  style: ats